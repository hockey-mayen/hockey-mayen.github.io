<header id="top">
    <div class="holiday-decor holiday-decor-left" aria-hidden="true"></div>
    <div class="holiday-decor holiday-decor-right" aria-hidden="true"></div>
    <div class="holiday-shooting-stars" aria-hidden="true">
        <span class="holiday-shooting-star"></span>
        <span class="holiday-shooting-star"></span>
        <span class="holiday-shooting-star"></span>
    </div>
    <div class="theme-toolbar">
        <div class="theme-switch" role="group" aria-label="Design auswählen">
            <button type="button" data-theme-choice="standard" aria-pressed="false">Standard</button>
            <span class="theme-divider" aria-hidden="true">|</span>
            <button type="button" data-theme-choice="christmas" aria-pressed="true">Weihnachten</button>
        </div>
    </div>
    <div class="header-container">
        <!-- Logo separat platzieren -->
        <div class="logo-container">
            <img src="/assets/images/logo_hc80.webp" alt="Vereinslogo" class="logo" width="250" height="250" fetchpriority="high">
        </div>

        <!-- Flexbox-Container für Titel und Navigation -->
        <div class="header-content">
            <div class="title-text">
                <h1 class="club-title"><span class="club-title-prefix">Hockey-Club</span> Grün-Weiss TuS Mayen</h1>
                <p class="subtitle">- Seit 1919 -</p>
            </div>
            <nav>
                <ul class="nav-grid">
                    <li><a href="{% if page.url == '/' %}#top{% else %}/{% endif %}" class="{% if page.url == '/' %}active{% endif %}"{% if page.url == '/' %} aria-current="page"{% endif %}>Aktuell</a></li>
                    <li><a href="{% if page.url == '/verein/' %}#top{% else %}/verein/{% endif %}" class="{% if page.url contains '/verein' %}active{% endif %}"{% if page.url == '/verein/' %} aria-current="page"{% endif %}>Der Club</a></li>
                    <li><a href="{% if page.url == '/training/' %}#top{% else %}/training/{% endif %}" class="{% if page.url contains '/training' %}active{% endif %}"{% if page.url == '/training/' %} aria-current="page"{% endif %}>Training</a></li>
                    <li><a href="{% if page.url == '/turniere/' %}#top{% else %}/turniere/{% endif %}" class="{% if page.url contains '/turniere' %}active{% endif %}"{% if page.url == '/turniere/' %} aria-current="page"{% endif %}>Turniere</a></li>
                    <li><a href="{% if page.url == '/veranstaltungen/' %}#top{% else %}/veranstaltungen/{% endif %}" class="{% if page.url contains '/veranstaltungen' %}active{% endif %}"{% if page.url == '/veranstaltungen/' %} aria-current="page"{% endif %}>Veranstaltungen</a></li>
                    <li><a href="{% if page.url == '/sportstaetten/' %}#top{% else %}/sportstaetten/{% endif %}" class="{% if page.url contains '/sportstaetten' %}active{% endif %}"{% if page.url == '/sportstaetten/' %} aria-current="page"{% endif %}>Sportstätten</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>
